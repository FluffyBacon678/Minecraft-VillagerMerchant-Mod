name: Build and GameTest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify mod and gameplay loop
        run: ./gradlew build --no-daemon --stacktrace

      - name: Surface GameTest failure details
        if: failure()
        shell: bash
        run: |
          log=build/run/gameTest/logs/latest.log
          if [[ -f "$log" ]]; then
            grep -Ei 'failed|failure|assert|timed out|expected|error' "$log" \
              | tail -n 20 \
              | while IFS= read -r line; do
                  echo "::error title=GameTest log::$line"
                done
          fi

      - name: Upload server test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: merchant-server-test-${{ github.run_attempt }}
          path: |
            build/run/gameTest/logs
            build/test-results
            build/reports/tests
          if-no-files-found: warn

  client-gui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: "true"
      ALSOFT_DRIVERS: "null"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify the real Merchant Post client screen
        run: ./gradlew runClientGameTest --no-daemon --stacktrace

      - name: Upload client test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: merchant-post-client-test-${{ github.run_attempt }}
          path: |
            build/run/clientGameTest/screenshots
            build/run/clientGameTest/logs
            build/run/clientGameTest/crash-reports
          if-no-files-found: warn
