name: Build and GameTest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify mod and gameplay loop
        run: ./gradlew build --no-daemon --stacktrace

  client-gui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      LIBGL_ALWAYS_SOFTWARE: "true"
      ALSOFT_DRIVERS: "null"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify the real Merchant Post client screen
        run: ./gradlew runClientGameTest --no-daemon --stacktrace

      - name: Upload client test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: merchant-post-client-test-${{ github.run_attempt }}
          path: |
            build/run/clientGameTest/screenshots
            build/run/clientGameTest/logs
            build/run/clientGameTest/crash-reports
          if-no-files-found: warn
