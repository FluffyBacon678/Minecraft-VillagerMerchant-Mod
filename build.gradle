plugins {
    id "fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "merchant_villager" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        datagen {
            inherit client
            name "Fabric Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("build/generated-resources")}"
            vmArg "-Dfabric-api.datagen.modid=merchant_villager"
            runDir "build/datagen"
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "merchant_villager_test"
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = "UTF-8"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.register("verifyReleaseJar") {
    group = "verification"
    description = "Checks that the distributable JAR contains production code and assets only."
    dependsOn tasks.named("remapJar")

    def releaseJar = tasks.named("remapJar").flatMap { it.archiveFile }
    def modrinthThumbnail = layout.projectDirectory.file(
        "art/merchant-villager-project-thumbnail-v2.png"
    )
    inputs.file(releaseJar)
    inputs.file(modrinthThumbnail)

    doLast {
        def requiredEntries = [
            "com/fluffybacon/merchantvillager/MerchantVillagerMod.class",
            "com/fluffybacon/merchantvillager/client/MerchantVillagerClient.class",
            "merchant_villager.mixins.json",
            "merchant_villager.client.mixins.json",
            "assets/merchant_villager/icon.png",
            "assets/merchant_villager/textures/entity/villager/profession/merchant.png",
            "assets/merchant_villager/textures/entity/villager/profession/merchant_clothing.png",
            "assets/merchant_villager/textures/entity/zombie_villager/profession/merchant.png"
        ]
        def forbiddenPatterns = [
            ~/(^|\/)(gametest|clienttest)(\/|$)/,
            ~/merchant_villager_test/
        ]

        def zip = new java.util.zip.ZipFile(releaseJar.get().asFile)
        try {
            def entries = java.util.Collections.list(zip.entries())*.name
            def forbiddenEntries = entries.findAll { entry ->
                forbiddenPatterns.any { pattern -> entry =~ pattern }
            }
            if (!forbiddenEntries.isEmpty()) {
                throw new GradleException("Release JAR contains test harness entries: ${forbiddenEntries}")
            }

            def missingEntries = requiredEntries.findAll { entry -> !entries.contains(entry) }
            if (!missingEntries.isEmpty()) {
                throw new GradleException("Release JAR is missing required assets: ${missingEntries}")
            }

            def metadataEntry = zip.getEntry("fabric.mod.json")
            if (metadataEntry == null) {
                throw new GradleException("Release JAR is missing fabric.mod.json")
            }
            def metadata = new groovy.json.JsonSlurper().parse(zip.getInputStream(metadataEntry))
            if (metadata.entrypoints?."fabric-gametest" || metadata.entrypoints?."fabric-client-gametest") {
                throw new GradleException("Release fabric.mod.json contains GameTest entrypoints")
            }
            if (metadata.version != project.version.toString()) {
                throw new GradleException("Release metadata version ${metadata.version} does not match ${project.version}")
            }
            if (metadata.suggests?.modmenu != "*"
                || metadata.custom?.modmenu?.update_checker != true) {
                throw new GradleException("Release metadata is missing optional Mod Menu integration")
            }

            def merchantTextureEntry = zip.getEntry(
                "assets/merchant_villager/textures/entity/villager/profession/merchant.png"
            )
            def merchantTexture = javax.imageio.ImageIO.read(zip.getInputStream(merchantTextureEntry))
            if (merchantTexture == null || merchantTexture.width != 64 || merchantTexture.height != 64) {
                throw new GradleException("Merchant profession texture must be a readable 64x64 image")
            }
            def merchantClothingEntry = zip.getEntry(
                "assets/merchant_villager/textures/entity/villager/profession/merchant_clothing.png"
            )
            def merchantClothing = javax.imageio.ImageIO.read(zip.getInputStream(merchantClothingEntry))
            if (merchantClothing == null
                || merchantClothing.width != 64
                || merchantClothing.height != 64) {
                throw new GradleException("Merchant clothing mask must be a readable 64x64 image")
            }
        } finally {
            zip.close()
        }

        def thumbnailFile = modrinthThumbnail.asFile
        if (thumbnailFile.length() > 256 * 1024) {
            throw new GradleException("Modrinth thumbnail exceeds 256 KiB: ${thumbnailFile.length()} bytes")
        }
        def thumbnail = javax.imageio.ImageIO.read(thumbnailFile)
        if (thumbnail == null || thumbnail.width != 256 || thumbnail.height != 256) {
            throw new GradleException("Modrinth thumbnail must be a readable 256x256 image")
        }
    }
}

tasks.named("check") {
    dependsOn tasks.named("verifyReleaseJar")
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
