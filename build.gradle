plugins {
    id "fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "merchant_villager" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        datagen {
            inherit client
            name "Fabric Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("build/generated-resources")}"
            vmArg "-Dfabric-api.datagen.modid=merchant_villager"
            runDir "build/datagen"
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "merchant_villager_test"
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = "UTF-8"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.register("verifyReleaseJar") {
    group = "verification"
    description = "Checks that the distributable JAR contains production code and assets only."
    dependsOn tasks.named("remapJar")

    def releaseJar = tasks.named("remapJar").flatMap { it.archiveFile }
    inputs.file(releaseJar)

    doLast {
        def requiredEntries = [
            "assets/merchant_villager/icon.png",
            "assets/merchant_villager/textures/entity/villager/profession/merchant.png",
            "assets/merchant_villager/textures/entity/zombie_villager/profession/merchant.png"
        ]
        def forbiddenPatterns = [
            ~/(^|\/)(gametest|clienttest)(\/|$)/,
            ~/merchant_villager_test/
        ]

        def zip = new java.util.zip.ZipFile(releaseJar.get().asFile)
        try {
            def entries = java.util.Collections.list(zip.entries())*.name
            def forbiddenEntries = entries.findAll { entry ->
                forbiddenPatterns.any { pattern -> entry =~ pattern }
            }
            if (!forbiddenEntries.isEmpty()) {
                throw new GradleException("Release JAR contains test harness entries: ${forbiddenEntries}")
            }

            def missingEntries = requiredEntries.findAll { entry -> !entries.contains(entry) }
            if (!missingEntries.isEmpty()) {
                throw new GradleException("Release JAR is missing required assets: ${missingEntries}")
            }

            def metadataEntry = zip.getEntry("fabric.mod.json")
            if (metadataEntry == null) {
                throw new GradleException("Release JAR is missing fabric.mod.json")
            }
            def metadata = new groovy.json.JsonSlurper().parse(zip.getInputStream(metadataEntry))
            if (metadata.entrypoints?."fabric-gametest" || metadata.entrypoints?."fabric-client-gametest") {
                throw new GradleException("Release fabric.mod.json contains GameTest entrypoints")
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named("check") {
    dependsOn tasks.named("verifyReleaseJar")
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
